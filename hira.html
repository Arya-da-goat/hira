<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hira</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#f4f4f4;font-family:"Trebuchet MS",Arial,sans-serif}
body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;background:#000}

/* Top bar — based on the supplied screenshot */
.top{
  height:108px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 24px 8px;
}
.circle{
  width:86px;height:86px;border-radius:50%;
  border:1px solid #4a4a4a;background:#303030;
  display:flex;align-items:center;justify-content:center;
}
.menu{font-size:44px;line-height:1;transform:translateY(-3px)}
.getplus{
  margin-right:auto;margin-left:16px;
  height:86px;padding:0 28px;border-radius:45px;
  background:#46515b;color:#59b5ff;
  font-size:27px;font-weight:700;
  display:flex;align-items:center;gap:13px;
}
.spark{font-size:35px;color:#35b8ff}
.chat-icon{
  width:43px;height:43px;border:4px solid #eee;border-radius:50%;
  position:relative;
}
.chat-icon:after{
  content:"";position:absolute;width:13px;height:10px;
  border-left:4px solid #eee;border-bottom:4px solid #eee;
  right:-5px;bottom:1px;transform:rotate(-20deg);
}

/* Center action area */
.actions{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 50px 27px;
  gap:30px;
}
.action{
  display:flex;align-items:center;gap:26px;
  font-size:28px;font-weight:600;color:#eee;
}
.icon{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;font-size:39px;color:#eee;
}
.globe{
  border:3px solid #eee;border-radius:50%;font-size:26px;
}
.globe::before{content:"↕";font-size:29px}
.globe::after{content:"";position:absolute}
.pencil{font-size:43px;transform:rotate(-12deg)}
.image-icon{
  width:39px;height:35px;border:3px solid #eee;border-radius:6px;
  position:relative;
}
.image-icon:before{
  content:"";position:absolute;width:8px;height:8px;border:3px solid #eee;
  border-radius:50%;right:4px;top:4px;
}
.image-icon:after{
  content:"";position:absolute;width:21px;height:13px;
  border-left:3px solid #eee;border-top:3px solid #eee;
  transform:rotate(28deg);left:4px;bottom:3px;
}

/* Composer */
.composer-wrap{padding:0 24px 20px}
.composer{
  min-height:185px;border-radius:42px;
  background:#303030;border:1px solid #444;
  display:flex;align-items:flex-end;
  padding:26px 14px 18px 28px;gap:10px;
}
.placeholder{
  align-self:flex-start;flex:1;color:#aaa;
  font-size:26px;margin-top:3px;
}
.plus{
  width:53px;height:53px;border:0;background:transparent;color:#fff;
  font-size:47px;font-weight:200;line-height:1;
}
.mic{
  width:55px;height:55px;border:0;background:transparent;color:#fff;
  font-size:38px;
}
.send{
  width:64px;height:64px;border:0;border-radius:50%;
  background:#fff;color:#000;font-size:30px;font-weight:900;
}
textarea{
  position:absolute;opacity:0;pointer-events:none;
}
#messages{
  display:none;
  position:absolute;inset:108px 0 205px;
  overflow-y:auto;padding:25px;
  flex-direction:column;gap:15px;
}
.msg{
  max-width:82%;padding:14px 18px;border-radius:20px;
  font-size:19px;line-height:1.35;
}
.user{align-self:flex-end;background:#303030}
.bot{align-self:flex-start;background:#171717;border:1px solid #333}

@media(max-width:520px){
  .top{padding-left:18px;padding-right:18px}
  .circle{width:72px;height:72px}
  .getplus{height:72px;font-size:23px;padding:0 20px}
  .chat-icon{width:38px;height:38px}
  .actions{padding-left:48px}
  .action{font-size:25px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="circle" aria-label="Menu"><span class="menu">☰</span></button>
    <div class="getplus"><span class="spark">✦</span> Hira</div>
    <button class="circle" aria-label="New chat"><span class="chat-icon"></span></button>
  </header>

  <main id="messages"></main>

  <section class="actions" id="actions">
    <div class="action"><span class="icon"><span class="image-icon"></span></span> Create an image</div>
    <div class="action"><span class="icon pencil">♢</span> Write or edit</div>
    <div class="action"><span class="icon globe"></span> Search the web</div>
  </section>

  <div class="composer-wrap">
    <div class="composer">
      <button class="plus" onclick="focusInput()">+</button>
      <div class="placeholder" id="placeholder">Ask Hira</div>
      <textarea id="input"></textarea>
      <button class="mic" onclick="startVoice()">♩</button>
      <button class="send" onclick="sendMessage()">↑</button>
    </div>
  </div>
</div>

<script>
const input=document.getElementById("input");
const placeholder=document.getElementById("placeholder");
const messages=document.getElementById("messages");
const actions=document.getElementById("actions");

function focusInput(){
  input.style.pointerEvents="auto";
  input.style.opacity="1";
  input.focus();
  input.style.position="fixed";
  input.style.left="85px";
  input.style.right="145px";
  input.style.bottom="48px";
  input.style.height="65px";
  input.style.background="transparent";
  input.style.border="0";
  input.style.outline="0";
  input.style.color="#fff";
  input.style.font="26px Trebuchet MS";
  placeholder.style.display="none";
}
async function webSearch(query){
  // Wikipedia's public endpoint needs no API key. It supports browser
  // cross-origin requests when origin=* is supplied.
  const url =
    "https://en.wikipedia.org/w/api.php" +
    "?action=query&list=search&srsearch=" +
    encodeURIComponent(query) +
    "&srlimit=5&format=json&origin=*";

  const res = await fetch(url);
  if(!res.ok) throw new Error("Search failed");
  const data = await res.json();

  if(!data.query || !data.query.search || data.query.search.length === 0){
    return null;
  }

  return data.query.search;
}

function cleanWikiText(text){
  const div=document.createElement("div");
  div.innerHTML=text;
  return div.textContent || div.innerText || "";
}

async function getWikipediaSummary(title){
  const url =
    "https://en.wikipedia.org/api/rest_v1/page/summary/" +
    encodeURIComponent(title.replace(/ /g,"_"));

  const res=await fetch(url);
  if(!res.ok) return null;
  const data=await res.json();

  if(data.type==="standard" && data.extract){
    return {
      title:data.title,
      extract:data.extract,
      url:data.content_urls?.desktop?.page || ""
    };
  }
  return null;
}

async function answerWithWeb(query){
  const results=await webSearch(query);

  if(!results){
    return {
      text:"I couldn't find a matching result on the web.",
      source:""
    };
  }

  // Try the first few search results until one has a useful summary.
  for(const result of results){
    const summary=await getWikipediaSummary(result.title);
    if(summary){
      return {
        text:summary.extract,
        source:summary.url
      };
    }
  }

  return {
    text:cleanWikiText(results[0].snippet),
    source:"https://en.wikipedia.org/wiki/" +
          encodeURIComponent(results[0].title.replace(/ /g,"_"))
  };
}

function addMessage(text, type, source=""){
  const el=document.createElement("div");
  el.className="msg "+type;
  el.textContent=text;

  if(source){
    const link=document.createElement("a");
    link.href=source;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="  Read source";
    link.style.color="#7fc7ff";
    link.style.display="block";
    link.style.marginTop="8px";
    link.style.fontSize="15px";
    el.appendChild(link);
  }

  messages.appendChild(el);
  messages.scrollTop=messages.scrollHeight;
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text)return;

  actions.style.display="none";
  messages.style.display="flex";

  addMessage(text,"user");

  input.value="";
  input.style.opacity="0";
  input.style.pointerEvents="none";
  placeholder.style.display="block";

  const loading=document.createElement("div");
  loading.className="msg bot";
  loading.textContent="Searching the web…";
  messages.appendChild(loading);
  messages.scrollTop=messages.scrollHeight;

  try{
    const answer=await answerWithWeb(text);
    loading.remove();
    addMessage(answer.text,"bot",answer.source);
  }catch(error){
    loading.remove();
    addMessage(
      "I couldn't reach the web right now. Check your internet connection and try again.",
      "bot"
    );
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
function startVoice(){
  if(!("webkitSpeechRecognition" in window)){
    alert("Voice input isn't supported in this browser.");
    return;
  }
  const r=new webkitSpeechRecognition();
  r.lang="en-IN";
  r.onresult=e=>{
    input.value=e.results[0][0].transcript;
    sendMessage();
  };
  r.start();
}
</script>
</body>
</html>
