<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kira | Chatspace</title>
    <meta name="description" content="Kira is a ChatGPT-inspired chatspace built for GitHub Pages." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark">K</div>
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Kira</h1>
          </div>
        </div>

        <button class="new-chat">+ New chat</button>

        <div class="thread-list">
          <div class="thread active">
            <span class="dot"></span>
            <span>Product strategy</span>
          </div>
          <div class="thread">
            <span class="dot"></span>
            <span>Landing page ideas</span>
          </div>
          <div class="thread">
            <span class="dot"></span>
            <span>Code review</span>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="user-pill">
            <div class="avatar">A</div>
            <div>
              <strong>Arya</strong>
              <small>Pro plan</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div class="model-info">
            <span class="status"></span>
            <span>Kira</span>
          </div>
          <div class="top-actions">
            <button type="button">Share</button>
            <button type="button">Settings</button>
          </div>
        </header>

        <section id="chat" class="chat-window" aria-live="polite"></section>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message Kira..."></textarea>
          <div class="composer-actions">
            <button type="button" class="secondary">+ Attach</button>
            <button type="submit" class="primary">Send</button>
          </div>
        </form>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
