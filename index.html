<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kira | Local AI</title>
    <meta name="description" content="Kira is a ChatGPT-inspired chatspace built for GitHub Pages." />
    <link rel="stylesheet" href="styles.css" />
  <meta name="kira-engine" content="v22-local-smart">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button class="icon-btn menu-btn" id="sidebarToggle" aria-label="Close sidebar"><i class="fa-solid fa-bars"></i></button>
          <div class="sidebar-brand"><span class="brand-dot">K</span><strong>Kira</strong></div>
          <button class="icon-btn" id="newChatTop" aria-label="New chat"><i class="fa-regular fa-pen-to-square"></i></button>
        </div>

        <button class="sidebar-new-chat" id="newChat">
          <i class="fa-solid fa-plus"></i><span>New chat</span>
        </button>
        <button class="sidebar-search" id="searchChats">
          <i class="fa-solid fa-magnifying-glass"></i><span>Search chats</span><span class="shortcut">Ctrl K</span>
        </button>

        <div class="sidebar-section-title">Chats</div>
        <div class="thread-list" id="threadList">
          <div class="thread active"><i class="fa-regular fa-message"></i><span>New conversation</span></div>
        </div>

        <div class="sidebar-footer">
          <button class="account-card" id="accountButton">
            <div class="avatar">A</div>
            <div class="account-text"><strong>Arya</strong><small>Free plan</small></div>
            <i class="fa-solid fa-ellipsis"></i>
          </button>
          <div class="account-menu" id="accountMenu">
            <div class="account-heading"><div class="avatar">A</div><div><strong>Arya</strong><small>Free plan</small></div></div>
            <button><i class="fa-regular fa-user"></i> Account</button>
            <button><i class="fa-solid fa-gear"></i> Settings</button>
            <button><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
          </div>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button>
          <div class="model-info"><span class="status"></span><strong>Kira</strong><i class="fa-solid fa-chevron-down"></i></div>
          <div class="top-actions"><button type="button" aria-label="Share"><i class="fa-solid fa-arrow-up-from-bracket"></i></button><button type="button" aria-label="More"><i class="fa-solid fa-ellipsis"></i></button></div>
        </header>

        <section id="chat" class="chat-window" aria-live="polite"></section>

        <form id="composer" class="composer">
          <div id="attachmentList" class="attachment-list"></div>
          <textarea id="prompt" rows="1" placeholder="Message Kira..."></textarea>
          <div class="composer-actions">
            <input id="fileInput" type="file" multiple hidden />
            <button type="button" class="secondary attach-btn" id="attachButton"><i class="fa-solid fa-paperclip"></i><span>Attach</span></button>
            <span class="composer-spacer"></span>
            <button type="submit" class="primary" aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
          </div>
        </form>
      </main>
    </div>

    <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <button class="settings-back" id="settingsClose" aria-label="Close settings">←</button>
          <div class="settings-title" id="settingsTitle">Settings</div>
        </header>
        <div class="settings-body" id="settingsHome">
          <div class="settings-profile">
            <div class="settings-avatar">A<span class="edit-dot">✎</span></div>
            <div><strong>Arya</strong><small>Personal</small></div>
          </div>
          <div class="settings-group-title">My Kira</div>
          <div class="settings-list">
            <button class="settings-row" data-settings="personalization"><span class="row-icon">☻</span><span class="row-main"><strong>Personalization</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="memory"><span class="row-icon">▣</span><span class="row-main"><strong>Memory</strong><small>Local conversation memory</small></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="research"><span class="row-icon">⌘</span><span class="row-main"><strong>Research & sources</strong><small>Control when Kira searches</small></span><span class="chevron">›</span></button>
          </div>
          <div class="settings-group-title">Account</div>
          <div class="settings-list">
            <button class="settings-row" data-settings="workspace"><span class="row-icon">□</span><span class="row-main"><strong>Workspace</strong><small>Personal</small></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="usage"><span class="row-icon">▥</span><span class="row-main"><strong>Usage and limits</strong></span><span class="chevron">›</span></button>
          </div>
          <div class="settings-group-title">Preferences</div>
          <div class="settings-list">
            <button class="settings-row" data-settings="appearance"><span class="row-icon">☼</span><span class="row-main"><strong>Appearance</strong></span><span class="chevron">⌄</span></button>
            <button class="settings-row" data-settings="accent"><span class="row-icon">◈</span><span class="row-main"><strong>Accent color</strong><small id="accentSummary">Blue</small></span><span class="chevron">›</span></button>
          </div>
          <div class="settings-group-title">General</div>
          <div class="settings-list">
            <button class="settings-row" data-settings="general"><span class="row-icon">⚙</span><span class="row-main"><strong>General</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="notifications"><span class="row-icon">♧</span><span class="row-main"><strong>Notifications</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="voice"><span class="row-icon">◖</span><span class="row-main"><strong>Voice</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="security"><span class="row-icon">◉</span><span class="row-main"><strong>Security and login</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="privacy"><span class="row-icon">◉</span><span class="row-main"><strong>Privacy center</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="storage"><span class="row-icon">▤</span><span class="row-main"><strong>Storage</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="data"><span class="row-icon">◌</span><span class="row-main"><strong>Data controls</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="remote"><span class="row-icon">▱</span><span class="row-main"><strong>Remote control</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="export"><span class="row-icon">⇩</span><span class="row-main"><strong>Export & backup</strong><small>Save your conversations locally</small></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="report"><span class="row-icon">⚠</span><span class="row-main"><strong>Report bug</strong></span><span class="chevron">›</span></button>
            <button class="settings-row" data-settings="about"><span class="row-icon">ⓘ</span><span class="row-main"><strong>About</strong></span><span class="chevron">›</span></button>
            <button class="settings-row danger" data-settings="logout"><span class="row-icon">↪</span><span class="row-main"><strong>Log out</strong></span></button>
          </div>
        </div>
        <div class="settings-body settings-subpage" id="settingsSubpage"></div>
      </section>
    </div>

    <script src="knowledge.js"></script>
    <script type="module" src="local-ai.js"></script>
    <script src="app.js"></script>
  
</body>
</html>
